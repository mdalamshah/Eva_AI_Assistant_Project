<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>Eva AI Assistant</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><aside><div class="brand"><div class="orb sm"><i></i></div><div><b>Eva</b><small>AI Assistant</small></div></div><button id="new">＋ New conversation</button><div class="owner-box"><button id="ownerLogin">🔐 Owner Login</button><span id="identity">Guest mode</span></div><div class="modes"><label>MODES</label><button class="active">✦ Assistant</button><button>◉ Voice</button><button>⚡ Agent</button></div><div class="ready"><i></i><span id="status">Eva is ready</span></div></aside><main><header><div class="mobile"><div class="orb xs"><i></i></div><b>Eva</b></div><div><button id="voice">🎙</button><button id="clear">⌫</button></div></header><section id="chat"><div id="welcome"><div class="orb hero"><i></i></div><small>PERSONAL AI ASSISTANT</small><h1>Hi, I'm <em>Eva.</em></h1><p>Your intelligent personal assistant. Ask me anything, plan something, or tell me what you need.</p><div class="chips"><button data-q="Who are you?">Who are you?</button><button data-q="Help me plan my day">Plan my day</button><button data-q="Give me a creative idea">Give me an idea</button><button data-q="What can you do?">What can you do?</button></div></div></section><form id="form"><div class="input"><textarea id="input" rows="1" placeholder="Message Eva..."></textarea><button type="button" id="mic">🎙</button><button class="send">➤</button></div><p>Eva can make mistakes. Check important information.</p></form></main></div><script src="/app.js"></script></body></html>
