name: Build Eva Android APK
on:
  workflow_dispatch:
    inputs:
      eva_url:
        description: Deployed Eva web URL
        required: true
        default: https://eva-ai-assistant-project.vercel.app/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug -PevaUrl="${{ inputs.eva_url }}" --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
